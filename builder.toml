description = 'Tiny base image (Ubuntu Jammy Jellyfish build image, distroless-like run image) with only Java buildpacks included. To use, specify buildpacks at build time.'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java-native-image:14.14.4'
version = '14.14.4'

[[buildpacks]]
uri = 'docker://docker.io/paketobuildpacks/java:22.8.0'
version = '22.8.0'

[lifecycle]
version = '0.21.28'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/java-native-image'
version = '14.14.4'

[[order]]
[[order.group]]
id = 'paketo-buildpacks/java'
version = '22.8.0'

[stack]
id = 'io.buildpacks.stacks.jammy.tiny'
build-image = 'docker.io/paketobuildpacks/build-jammy-tiny:0.2.198'
run-image = 'index.docker.io/paketobuildpacks/run-jammy-tiny:latest'

[[targets]]
os = 'linux'
arch = 'amd64'

[[targets]]
os = 'linux'
arch = 'arm64'
